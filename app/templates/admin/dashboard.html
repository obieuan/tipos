{% extends "base.html" %}

{% block content %}
<div class="page-container">
    <h1 class="page-title">Panel de Administración</h1>

    <div class="admin-cards">
        <a href="{{ url_for('views.admin_users') }}" class="admin-card">
            <svg class="admin-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span class="admin-card-title">Gestión de Usuarios</span>
            <span class="admin-card-desc">Crear, editar y administrar usuarios</span>
        </a>

        <a href="{{ url_for('views.admin_settings') }}" class="admin-card">
            <svg class="admin-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <span class="admin-card-title">Configuración</span>
            <span class="admin-card-desc">Disclaimer, modo de reserva, días</span>
        </a>

        <a href="{{ url_for('views.admin_blocked_days') }}" class="admin-card">
            <svg class="admin-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
                <line x1="9" y1="14" x2="15" y2="20"/>
                <line x1="15" y1="14" x2="9" y2="20"/>
            </svg>
            <span class="admin-card-title">Bloquear Días</span>
            <span class="admin-card-desc">Bloquear y desbloquear fechas</span>
        </a>
    </div>
</div>
{% endblock %}
